[package]
name = "ydl-gui"
version = "0.1.0"
edition = "2021"
description = "Polished desktop UI for the ydl YouTube downloader"
default-run = "ydl-gui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
ydl = { path = "..", default-features = false }
